<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loyalty Overlay</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div class="overlay">
      <p id="room" class="room">Connecting…</p>
      <section id="card-watching" class="card card-watching hidden">
        <p class="label">Watching now</p>
        <ul id="watching" class="list"></ul>
      </section>

      <section id="card-board" class="card card-board hidden">
        <p class="label">Top fans</p>
        <ol id="leaderboard" class="list numbered"></ol>
      </section>

      <section id="card-feed" class="card card-feed wide hidden">
        <p class="label">Just happened</p>
        <ul id="feed" class="feed"></ul>
      </section>
    </div>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
